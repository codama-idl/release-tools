name: Promote

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  promote:
    name: Promote the release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Create contents token
        id: contents-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create administration token
        id: admin-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-administration: write

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.contents-token.outputs.token }}

      - name: Checkout release-tools
        uses: actions/checkout@v7
        with:
          repository: codama-idl/release-tools
          # The exact commit of this reusable workflow file, so callers pinning
          # a tag get the matching scripts. (github.job_workflow_ref is an OIDC
          # claim only; job_workflow_sha is the context property.)
          ref: ${{ github.job_workflow_sha }}
          path: .release-tools

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Promote
        run: node .release-tools/src/tasks/promote.mjs
        env:
          CONTENTS_TOKEN: ${{ steps.contents-token.outputs.token }}
          ADMIN_TOKEN: ${{ steps.admin-token.outputs.token }}
          APP_SLUG: ${{ steps.contents-token.outputs.app-slug }}
